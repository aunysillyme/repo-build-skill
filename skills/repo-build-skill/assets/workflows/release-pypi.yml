# Configure the PyPI trusted publisher for OWNER/NAME and this workflow filename.
# Re-check the publishing tools and registry requirements on the release date.
name: Release Python package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require tag equals version
        run: |
          python3 <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if tag != version:
              raise SystemExit(f'Tag {tag} differs from version {version}')
          PY
      - run: python3 -m unittest discover

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the distribution once
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/publish-tools"
          "$RUNNER_TEMP/publish-tools/bin/python" -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          "$RUNNER_TEMP/publish-tools/bin/python" -m build
          "$RUNNER_TEMP/publish-tools/bin/python" -m twine check dist/*
          python3 -m venv "$RUNNER_TEMP/install-trial"
          "$RUNNER_TEMP/install-trial/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/install-trial/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if tag != project['version'] or importlib.metadata.version(project['name']) != tag:
              raise SystemExit('Installed artifact, tag and version must agree')
          PY
      - name: Exchange CI identity and publish those distributions
        run: |
          "$RUNNER_TEMP/publish-tools/bin/python" <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          request_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          separator = '&' if '?' in request_url else '?'
          identity_request = urllib.request.Request(
              request_url + separator + urllib.parse.urlencode({'audience': 'pypi'}),
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(identity_request, timeout=30) as response:
              identity = json.load(response)['value']
          mint_request = urllib.request.Request('https://pypi.org/_/oidc/mint-token',
              data=json.dumps({'token': identity}).encode(),
              headers={'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(mint_request, timeout=30) as response:
              credential = json.load(response)['token']
          environment = dict(os.environ, TWINE_USERNAME='__token__', TWINE_PASSWORD=credential,
              TWINE_NON_INTERACTIVE='1')
          subprocess.run([os.path.join(os.environ['RUNNER_TEMP'], 'publish-tools/bin/python'),
              '-m', 'twine', 'upload', '--non-interactive', *sorted(__import__('glob').glob('dist/*'))],
              env=environment, check=True)
          PY
