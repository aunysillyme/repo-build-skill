# Configure the PyPI trusted publisher for OWNER/NAME and this workflow filename.
# Re-check the publishing tools and registry requirements on the release date.
name: Release Python package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require tag equals version
        run: |
          python3 <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if tag != version:
              raise SystemExit(f'Tag {tag} differs from version {version}')
          PY
      - run: python3 -m unittest discover
      - name: Build, check and smoke-install the distributions once
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/python" -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          "$RUNNER_TEMP/build-tools/bin/python" -m build
          "$RUNNER_TEMP/build-tools/bin/python" -m twine check dist/*
          python3 -m venv "$RUNNER_TEMP/install-trial"
          "$RUNNER_TEMP/install-trial/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/install-trial/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if tag != project['version'] or importlib.metadata.version(project['name']) != tag:
              raise SystemExit('Installed artifact, tag and version must agree')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
