# Configure the npm trusted publisher for OWNER/NAME and this workflow filename.
name: Release npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require tag equals version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build --if-present
      - name: Pack once and smoke-install that tarball
        run: |
          set -eu
          binary="$(node -p "const b=require('./package.json').bin; typeof b==='string' ? require('./package.json').name.split('/').pop() : Object.keys(b||{})[0] || ''")"
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          tarball="$release/$(npm pack --silent --pack-destination "$release")"
          trial="$(mktemp -d)"
          trap 'rm -rf "$trial"' EXIT
          cd "$trial"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          if [ -n "$binary" ]; then "./node_modules/.bin/$binary" --help; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@12.2.0 --ignore-scripts
      - name: Publish that exact tarball
        run: |
          set -eu
          set -- ./release/*.tgz
          test "$#" -eq 1
          npm publish "$1" --provenance --access public
