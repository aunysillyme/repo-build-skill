name: Refresh proof

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-proof
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Measure the package
        run: node scripts/proof.mjs --deterministic
      - name: Verify measurement rows
        run: node --test test/proof.test.mjs
      - name: Propose refreshed proof in one pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-proof-branch.mjs
